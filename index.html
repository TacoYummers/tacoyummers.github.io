<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old-School Pixel Art Website</title>
    <style>
        body {
            background-color: #000;
            color: #FFF;
            font-family: "Comic Sans MS";
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            color: #ee00ff;
            text-shadow: 8px 8px #6a0abf;
        }

        .content {
            max-width: 800px;
            text-align: center;
        }

        .pixel-art {
            margin-top: 20px;
        }

        .pixel-art img {
            image-rendering: pixelated;
            width: 200px;
            height: 200px;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hi, I'm Taco!</h1>
    </header>
    <div class="content">
        <p>I'm a game developer (I use GMS2) and game modder (Usually modding GMS2 games)</p>
        <p>I mod Pizza Tower, Minecraft, Doom, Etc</p>
        <p>I also love oldschool / 2000s media, and modding old games or playing them.</p>
    </div>
    <footer>
        <p>NOT copyrighted, i think?</p>
    </footer>
</body>
</html>
