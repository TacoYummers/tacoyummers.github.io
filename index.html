<head>
    <title>Hi, I'm Taco!</title>
    <style>
        @font-face {
            font-family: "OkFont";
            src: url("ok.ttf") format("truetype");
        }
        body {
            background-image: url("bgSCALED.png");
            background-repeat: repeat;
            background-position: 0 0;
            background-size: auto;
            image-rendering: pixelated;
            animation: scrollBackground 4s steps(48) infinite;
            color: #FFF;
            font-family: "OkFont", "Comic Sans MS", "Comic Sans", cursive;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-size: 32px;
            -webkit-font-smoothing : none;
        }
        @keyframes scrollBackground {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 128px 128px;
            }
        }
        .content-wrapper {
            animation: jitter 8s steps(8) infinite;
            text-align: center;
        }
        @keyframes jitter {
            0% { transform: translateY(4px); }
            10% { transform: translateY(-12px); }
            20% { transform: translateY(-16px); }
            30% { transform: translateY(-18px); }
            40% { transform: translateY(-16px); }
            50% { transform: translateY(-12px); }
            60% { transform: translateY(-2px); }
            70% { transform: translateY(8px); }
            80% { transform: translateY(18px); }
            90% { transform: translateY(20px); }
            100% { transform: translateY(8px); }
        }
        .content {
            max-width: 100%;
            text-align: center;
            margin: 20px 0;
        }
        img {
            image-rendering: pixelated;
            width: 1120px;
            height: auto;
        }
        footer {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <div class="content-wrapper">
            <img src="art.png" alt="Pixel art illustration">
            <div class="content">
                <p>I'm a game developer (I use GMS2) and game modder (Usually modding GMS2 games)</p>
                <p>I mod Pizza Tower, Minecraft, Doom, Etc</p>
                <p>I also love oldschool / 2000s media, and modding old games or playing them.</p>
            </div>
        </div>
    </div>
    <footer>
        NOT &copy;, the copyright company people, lol.
    </footer>
</body>
</html>
