<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TacoYummers</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            font-family: "Comic Sans MS", cursive, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            image-rendering: pixelated;
            background-image: url('background.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: 100% 110%;
        }
        img {
            width: 836px;
            padding: 40px;
        }
        .description-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 90%;
            font-size: 135%;
        }
        .description-box h2 {
            margin-bottom: 20px;
        }
        .description-box ul {
            list-style-type: none;
            padding: 0;
        }
        .description-box li {
            margin-bottom: 10px;
        }
        .description-box a {
            color: cyan;
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Logo">
    <div class="description-box">
        <h1>This is outdated and probably will never get updated.</h1>
    </div>
</body>
</html>
